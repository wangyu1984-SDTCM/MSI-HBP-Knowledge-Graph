server {
    listen 80;
    server_name tcmhyperanx-knowledgegraph.cn www.tcmhyperanx-knowledgegraph.cn;
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tcmhyperanx-knowledgegraph.cn www.tcmhyperanx-knowledgegraph.cn;

    # SSL证书配置（需要替换为实际证书路径）
    ssl_certificate /etc/nginx/ssl/tcmhyperanx-knowledgegraph.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/tcmhyperanx-knowledgegraph.cn.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 日志
    access_log /var/log/nginx/tcmhyperanx_access.log;
    error_log /var/log/nginx/tcmhyperanx_error.log;

    # 反向代理到Streamlit
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # WebSocket支持（Streamlit需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_read_timeout 86400;
        proxy_connect_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
